<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800;900&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1584px;height:396px;overflow:hidden;background:#090d15;font-family:'Geist',sans-serif;color:#fff}
  .stage{position:relative;width:1584px;height:396px;overflow:hidden;
    background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
    background-size:44px 44px}
  .content{position:absolute;right:90px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .logo{display:flex;align-items:center;gap:26px}
  .mark{position:relative;width:52px;height:52px;margin-left:14px}
  .mark div{position:absolute;width:44px;height:44px;border-radius:4px;top:4px}
  .m1{left:-14px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.1)}
  .m2{left:-2px;background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.3)}
  .m3{left:12px;background:rgba(6,182,212,.2);border:1px solid #22d3ee}
  .word{font-weight:900;font-size:30px;letter-spacing:.04em;line-height:1}
  .word span{color:#67c9d6}
  .sub{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9ca3af;margin-top:6px}
  h1{font-size:38px;font-weight:600;line-height:1.12;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#67c9d6}
  .tags{display:flex;flex-wrap:wrap;gap:10px}
  .tag{font-size:15px;font-weight:600;color:#67e8f9;background:rgba(8,51,68,.45);border:1px solid rgba(21,94,117,.45);padding:6px 12px;border-radius:6px}
  .tag.ai{color:#fff;border-color:rgba(34,211,238,.6)}
</style></head>
<body><div class="stage">
  <div class="content">
    <div class="logo">
      <div class="mark"><div class="m1"></div><div class="m2"></div><div class="m3"></div></div>
      <div><div class="word">X<span>E</span>NTO</div><div class="sub">it-solutions</div></div>
    </div>
    <h1 id="h1"></h1>
    <div class="tags" id="tags"></div>
  </div>
</div>
<script>
  const T = {
    de: { h1: 'Legacy-PHP modernisieren.<br><em>KI-Funktionen integrieren.</em>',
          tags: ['PHP 8 · Symfony','Softwarearchitektur','Legacy-Modernisierung','REST-APIs','LLM · RAG · LangGraph'] },
    en: { h1: 'Modernise legacy PHP.<br><em>Integrate AI features.</em>',
          tags: ['PHP 8 · Symfony','Software architecture','Legacy modernisation','REST APIs','LLM · RAG · LangGraph'] }
  };
  const t = T[(location.hash.slice(1) || 'de')];
  document.getElementById('h1').innerHTML = t.h1;
  document.getElementById('tags').innerHTML = t.tags.map((x,i)=>`<span class="tag${i===t.tags.length-1?' ai':''}">${x}</span>`).join('');
</script>
</body></html>
